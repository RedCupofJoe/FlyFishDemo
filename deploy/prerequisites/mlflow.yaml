# Development MLflow instance for FlyFish agent traces.
# Apply only after the MLflow operator component is Managed on the DataScienceCluster.
# This file is cluster-admin work. It is not included in deploy/ai.
# Production should use PostgreSQL and S3 instead of SQLite and a volume.
apiVersion: mlflow.opendatahub.io/v1
kind: MLflow
metadata:
  name: mlflow
  namespace: redhat-ods-applications
spec:
  storage:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 10Gi
  backendStoreUri: "sqlite:////mlflow/mlflow.db"
  artifactsDestination: "file:///mlflow/artifacts"
  serveArtifacts: true
  defaultArtifactRoot: "mlflow-artifacts:/"
