apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: trends-mcp
  namespace: flyfish-ai
  labels:
    app.kubernetes.io/part-of: flyfish
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: trends-mcp
  namespace: flyfish-ai
  labels:
    app.kubernetes.io/part-of: flyfish
spec:
  source:
    type: Git
    git:
      uri: https://github.com/RedCupofJoe/FlyFishDemo.git
      ref: main
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: components/mcp/Containerfile
      buildArgs:
        - name: FLYFISH_TOOL
          value: trends
  output:
    to:
      kind: ImageStreamTag
      name: trends-mcp:0.1.0
  triggers: []
---
apiVersion: mcp.x-k8s.io/v1alpha1
kind: MCPServer
metadata:
  name: trends-mcp
  namespace: flyfish-ai
  labels:
    app.kubernetes.io/part-of: flyfish
    flyfish/tool: trends
spec:
  source:
    type: ContainerImage
    containerImage:
      ref: image-registry.openshift-image-registry.svc:5000/flyfish-ai/trends-mcp:0.1.0
  config:
    port: 8080
    path: /mcp
