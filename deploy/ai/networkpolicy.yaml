apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: response-agent-from-ui
  namespace: flyfish-ai
spec:
  podSelector:
    matchLabels:
      app: response-agent
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: flyfish-ui
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
